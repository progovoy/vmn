[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vmn-exp"
version = "0.1.37"  # written by `vmn stamp vmn_exp`, shared with vmn-exp-sdk
description = "vmn experiment platform: the vmn-exp CLI, dashboard and git-mode capture"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Pavel Rogovoy", email = "p.rogovoy@gmail.com" }]
requires-python = ">=3.10"
keywords = ["experiment tracking", "mlops", "machine learning", "model registry", "git", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # The first vmn without its own `vmn exp`, with the plugin hooks used here.
    "vmn>0.10.2rc9,<1",
    # Released together with this package; tests/test_workspace.py keeps the
    # pin equal to this package's own version.
    "vmn-exp-sdk==0.1.37",
]

[project.optional-dependencies]
# No orjson: it has no free-threaded wheels, and building it needs Rust. The ui
# renders JSON with it when installed (the `orjson` extra), else the stdlib.
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
orjson = ["orjson>=3.9"]
s3 = ["vmn-exp-sdk[s3]"]
gcs = ["vmn-exp-sdk[gcs]"]
azure = ["vmn-exp-sdk[azure]"]
mlflow = ["mlflow-skinny>=2.17"]
postgres = ["psycopg[binary]>=3", "psycopg_pool>=3.2"]
parquet = ["pyarrow>=17"]

[project.scripts]
vmn-exp = "vmn_exp.cli.main:main"

[project.entry-points."vmn.plugins"]
dev_version = "vmn_exp.cli.plugin:register_dev_version"

[project.urls]
Homepage = "https://github.com/progovoy/vmn"
Documentation = "https://github.com/progovoy/vmn/blob/master/docs/vmn-exp/README.md"
Changelog = "https://github.com/progovoy/vmn/blob/master/packages/vmn-exp/CHANGELOG.md"
Issues = "https://github.com/progovoy/vmn/issues"
Source = "https://github.com/progovoy/vmn/tree/master/packages/vmn-exp"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true  # vmn_exp is shared with vmn-exp-sdk (PEP 420)

[tool.setuptools.package-data]
"vmn_exp.cli" = ["docs/*.md"]  # docs -> repo docs/vmn-exp, for `vmn-exp skill`
"vmn_exp.ui" = ["static/*", "static/assets/*", "export_bundle/*"]
"vmn_exp.ui.migrations" = ["*.sql"]
