# git-cliff config for packages/vmn-exp/CHANGELOG.md (vmn-exp and vmn-exp-sdk).
# `make _changelog NAME=vmn_exp` rebuilds the whole file from the vmn_exp_ tags,
# scoped to the two exp packages with --include-path; release_exp.sh runs it
# after the upload. Never edit CHANGELOG.md by hand.

[changelog]
header = """
# vmn-exp changelog

vmn-exp and vmn-exp-sdk share one version. Generated by git-cliff from the
commits under `packages/vmn-exp` and `packages/vmn-exp-sdk`; do not edit.
Every release is a 0.1.x patch, so what an operator or user has to do on
upgrade is in [upgrading.md](../../docs/vmn-exp/upgrading.md).
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="vmn_exp_") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
tag_pattern = "^vmn_exp_[0-9]"
# The init-app tag is not a release; commits before it predate vmn-exp.
skip_tags = "^vmn_exp_0\\.0\\.0$"
topo_order = false
sort_commits = "newest"
# The first match wins. The HTML comments order the groups and are stripped
# when rendered. Only user-facing types are listed (feat / fix / perf); a `!`
# commit or a BREAKING CHANGE footer goes first, under Behaviour changes
# (docs/vmn-exp/upgrading.md, rule 2).
commit_parsers = [
  { message = "^[a-z]+(\\([^)]*\\))?!:", group = "<!-- 0 -->Behaviour changes" },
  { body = "BREAKING[ -]CHANGE", group = "<!-- 0 -->Behaviour changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^(test|refactor|docs|chore|style|ci|build)", skip = true },
  { message = "Stamped version", skip = true },
]
