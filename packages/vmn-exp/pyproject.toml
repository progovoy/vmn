[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vmn-exp"
version = "0.1.3"  # written by `vmn stamp vmn_exp`, shared with vmn-exp-sdk
description = "vmn experiment platform: the vmn-exp CLI, dashboard and git-mode capture"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pavel Rogovoy", email = "p.rogovoy@gmail.com" }]
requires-python = ">=3.8"
dependencies = [
    # The first vmn without its own `vmn exp`, with the plugin hooks used here.
    "vmn>0.10.2rc9,<1",
    # Released together with this package; tests/test_workspace.py keeps the
    # pin equal to this package's own version.
    "vmn-exp-sdk==0.1.3",
]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "orjson>=3.9"]
s3 = ["vmn-exp-sdk[s3]"]
gcs = ["vmn-exp-sdk[gcs]"]
azure = ["vmn-exp-sdk[azure]"]
mlflow = ["mlflow-skinny"]
postgres = ["psycopg[binary]>=3"]

[project.scripts]
vmn-exp = "vmn_exp.cli.main:main"

[project.entry-points."vmn.plugins"]
dev_version = "vmn_exp.cli.plugin:register_dev_version"

[project.urls]
Homepage = "https://github.com/progovoy/vmn"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true  # vmn_exp is shared with vmn-exp-sdk (PEP 420)

[tool.setuptools.package-data]
"vmn_exp.ui" = ["static/*", "static/assets/*"]
"vmn_exp.ui.migrations" = ["*.sql"]
